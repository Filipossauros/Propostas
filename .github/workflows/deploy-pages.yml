name: Deploy to GitHub Pages

# O site publica duas versões da aplicação, lado a lado:
#   · a estável (ramo claude/app-development-3g3pv9) na raiz do site;
#   · a nova, em desenvolvimento (ramo claude/biblioteca), em /nova/.
# A publicação corre a partir do ramo estável (envio ou execução manual) e
# constrói sempre os dois ramos. O ambiente github-pages só aceita publicar a
# partir dos ramos autorizados, pelo que um envio para claude/biblioteca não
# dispara a publicação: lança-se à mão («Run workflow») no ramo estável. A aplicação usa caminhos relativos
# (base './'), pelo que funciona tanto na raiz como em /nova/.

on:
  push:
    branches:
      - main
      - claude/app-development-3g3pv9
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez, sem cancelar a que está em curso: cancelar o
# Pages a meio pode deixá-lo preso em «updating_pages», e a publicação
# seguinte da mesma versão sai cancelada. A mais recente fica em fila.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/app-development-3g3pv9
          path: estavel
      - uses: actions/checkout@v5
        with:
          ref: claude/biblioteca
          path: nova
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            estavel/package-lock.json
            nova/package-lock.json
      - name: Versão estável (raiz)
        working-directory: estavel
        run: |
          npm ci
          npm test
          npm run build
      - name: Versão nova (/nova/)
        working-directory: nova
        run: |
          npm ci
          npm test
          npm run build
      - name: Juntar as duas versões
        run: |
          rm -rf site
          cp -r estavel/dist site
          mkdir -p site/nova
          cp -r nova/dist/. site/nova/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
